<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Ambient Obsidian squircle background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1322" />
      <stop offset="100%" stop-color="#07090F" />
    </linearGradient>

    <!-- Scale Metallic / Electric Indigo Gradient -->
    <linearGradient id="scaleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7D2FE" />
      <stop offset="35%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Fulcrum Core Glow -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Subtle Hairline Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.1" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#6366F1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base Frame (Standard Apple App Icon curvature r=115) -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="114" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- Minimalist Geometric Balance Scale -->
  <g filter="url(#glow)">
    <!-- Central Pillar / Stem -->
    <line x1="256" y1="140" x2="256" y2="390" stroke="url(#scaleGrad)" stroke-width="14" stroke-linecap="round" />

    <!-- Weighted Base Pedestal -->
    <path d="M196 390 H316" stroke="url(#scaleGrad)" stroke-width="16" stroke-linecap="round" />
    <path d="M226 366 H286" stroke="url(#scaleGrad)" stroke-width="8" stroke-linecap="round" opacity="0.6" />

    <!-- Perfectly Balanced Horizontal Beam -->
    <path d="M110 170 C160 162, 352 162, 402 170" stroke="url(#scaleGrad)" stroke-width="12" stroke-linecap="round" />

    <!-- Left Pan Suspension Lines -->
    <path d="M110 170 L70 290" stroke="url(#scaleGrad)" stroke-width="5" stroke-linecap="round" opacity="0.85" />
    <path d="M110 170 L150 290" stroke="url(#scaleGrad)" stroke-width="5" stroke-linecap="round" opacity="0.85" />

    <!-- Left Balance Pan (Curved minimal arc) -->
    <path d="M56 290 C70 326, 150 326, 164 290 Z" fill="url(#scaleGrad)" fill-opacity="0.2" stroke="url(#scaleGrad)" stroke-width="10" stroke-linejoin="round" />

    <!-- Right Pan Suspension Lines -->
    <path d="M402 170 L362 290" stroke="url(#scaleGrad)" stroke-width="5" stroke-linecap="round" opacity="0.85" />
    <path d="M402 170 L442 290" stroke="url(#scaleGrad)" stroke-width="5" stroke-linecap="round" opacity="0.85" />

    <!-- Right Balance Pan (Curved minimal arc) -->
    <path d="M348 290 C362 326, 442 326, 456 290 Z" fill="url(#scaleGrad)" fill-opacity="0.2" stroke="url(#scaleGrad)" stroke-width="10" stroke-linejoin="round" />

    <!-- Central Fulcrum Node / Pivot Jewel -->
    <circle cx="256" cy="166" r="16" fill="url(#coreGrad)" />
    <circle cx="256" cy="166" r="7" fill="#1E1B4B" />

    <!-- Apex Finial (Top Diamond) -->
    <polygon points="256,108 266,124 256,140 246,124" fill="url(#coreGrad)" />
  </g>
</svg>