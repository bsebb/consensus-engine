<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=2" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NoYouPick — End the Group Debate</title>

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.webmanifest?v=2" />
    <meta name="theme-color" content="#0B0F19" />
    <meta name="description" content="Stop arguing about where to eat or what to watch. Swipe on spots with friends and let NoYouPick find the winner." />

    <!-- Mobile & PWA Web App Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('app-theme') || 'system';
          var isDark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', isDark ? '#111113' : '#f7f5f0');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
